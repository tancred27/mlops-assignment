name: CI

on:
  push:
  workflow_dispatch:

jobs:
  lint-test-train:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Clean data
        run: python -m src.data.clean_data

      - name: Train and track models
        run: python -m src.models.train_mlflow

      - name: Run unit tests
        run: pytest -v --junitxml=reports/junit.xml

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            models/
            reports/
            mlflow.db
            mlruns/
          if-no-files-found: warn